  Calon pembeli diminta transfer/DP dulu ke rekening pribadi, barang tidak
  pernah dikirim. Kadang mengaku menyediakan rekber (rekening bersama) palsu.
red_flags:
  - "Diminta transfer/DP dulu ke rekening pribadi"
  - "Harga jauh di bawah pasaran"
  - "Tidak mau COD atau marketplace resmi"
match:
