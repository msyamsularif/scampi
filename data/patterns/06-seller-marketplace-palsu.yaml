    - ["bayar dulu", "transfer dulu", "dp dulu", "transfer ke rekening", "bayar ke rekening"]
    - ["a.n", "a/n", "atas nama", "rekber"]
  strength: strong
impersonated_entities: []
correct_response:
  - "Gunakan marketplace resmi atau COD, jangan transfer langsung ke rekening pribadi."
  - "Simpan semua bukti chat dan transfer untuk pelaporan."
  - "Laporkan rekeningnya lewat kanal aduan resmi."
sources:
