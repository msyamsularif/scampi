id: bansos-subsidi-palsu
name: "Bantuan sosial/subsidi palsu"
description: >-
  Pesan mengaku bantuan sosial/subsidi cair, meminta data pribadi (NIK, KK) atau
  pembukaan link pendaftaran. Sering berkedok program pemerintah.
red_flags:
  - "Bantuan cair mendadak lewat pesan pribadi"
  - "Diminta data NIK, KK, atau foto KTP lewat link"
  - "Link bukan domain instansi resmi (*.go.id)"
match:
  groups:
    - ["bansos", "bantuan sosial", "subsidi", "bantuan pemerintah", "blt", "pkh"]
    - ["daftar", "klaim", "nik", "kk", "data diri", "cek penerima", "cair"]
  strength: strong
impersonated_entities: ["Kementerian Keuangan", "Komdigi"]
correct_response:
  - "Program bansos resmi tidak mendata lewat WA/link pribadi."
  - "Jangan kirim foto KTP/KK atau data NIK lewat tautan atau chat pribadi."
  - "Cek programnya di situs instansi resmi (*.go.id) atau kantor kelurahan."
sources:
  - "Pola umum dilaporkan media nasional dan aduan publik; kurasi awal (seed)."
last_reviewed_at: "2026-10-06"
