id: undangan-pernikahan-apk
name: "Undangan pernikahan berisi APK"
description: >-
  Undangan (pernikahan/ulang tahun) yang menyertakan file APK. Setelah dipasang,
  aplikasi palsu ini mencuri SMS/kode OTP untuk membobol rekening.
red_flags:
  - "Undangan datang dari nomor tak dikenal"
  - "Diminta memasang aplikasi/APK dari sebuah link"
  - "Link bukan domain resmi kurir/marketplace maupun platform undangan mana pun"
match:
  groups:
    - ["undangan", "invitation", "wedding"]
    - ["apk", "aplikasi", "instal", "install", "unduh", "download", "pasang"]
  strength: strong
impersonated_entities: []
correct_response:
  - "Jangan instal APK itu — aplikasi dari sumber tidak resmi bisa mencuri SMS dan kode bank."
  - "Hapus pesan dan blokir pengirimnya."
  - "Ingatkan keluarga/teman yang mungkin menerima pesan serupa."
sources:
  - "Pola umum dilaporkan media nasional dan aduan publik; kurasi awal (seed)."
last_reviewed_at: "2026-10-06"
