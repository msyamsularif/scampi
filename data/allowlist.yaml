# Scampi — curated official-domain allowlist.
#
# One entry per entity: banks, e-wallets, couriers, marketplaces, government,
# utilities, messaging. `domains` are registrable domains (a subdomain of a
# listed domain also counts as official). Review dates belong in the entry
# when it changes; see docs/curation-runbook.md.
#
# A brand mentioned in a message whose link is NOT one of these domains is a
# strong signal. A few aliases are ordinary Indonesian words — those are
# matched case-sensitively (see allowlist.WEAK_ALIASES).

entries:
